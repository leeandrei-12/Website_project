<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laro Name</title>

    <link rel="stylesheet" href="GamePanel.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">

        <a href="#" class="brand">LARO NG LAHI</a>

        <ul class="nav-links">
            <li><a href="#">HOME</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">GAMES</a></li>
            <li><a href="#">LOG IN</a></li>
        </ul>

    </nav>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- GAME CAROUSEL -->
        <div class="carousel">

            <h1 id="game-title">Patintero</h1>

            <!-- GAME IMAGE -->
            <img id="game-image" src="patintero.jpg" alt="Patintero">

            <!-- LEFT ARROW -->
            <button class="arrow left" onclick="previousSlide()">
                &lt;
            </button>

            <!-- RIGHT ARROW -->
            <button class="arrow right" onclick="nextSlide()">
                &gt;
            </button>

            <!-- SLIDE INDICATORS -->
            <div class="indicators" id="indicators"></div>

        </div>

        <!-- GAME INFORMATION -->
        <div class="game-information">

            <h2>Game Information</h2>

            <div class="game-details">

                <h3>Game Name</h3>
                <p id="game-name">Patintero</p>

                <h3>Description</h3>
                <p id="game-description"></p>

                <h3>Number of Players</h3>
                <p id="game-players"></p>

                <h3>Materials Needed</h3>
                <p id="game-materials"></p>

                <h3>How to Play</h3>
                <ol id="game-instructions"></ol>

            </div>

        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script src="GamePanel.js"></script>

</body>
</html>
